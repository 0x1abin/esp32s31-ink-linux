# The ROM/SPL/XIP addresses follow Espressif's ESP32-S31 NOR layout.
CHIP=esp32s31
SPL_SRAM_ADDR=0x2F040000
ESPTOOL_FLASH="--flash-mode dio --flash-freq 80m --flash-size 16MB"
FLASH_SIZE=0x1000000
SLOT_SPL=0x002000
SLOT_UBOOT_ITB=0x100000
SLOT_DTB=0x300000
SLOT_KERNEL=0x500000
SLOT_ROOTFS=0xC00000
SPL_DTB_BIN=u-boot-spl-dtb.bin
UBOOT_ITB=u-boot.itb
BASE_DTB=metalio-eink4-plus.dtb
KERNEL_IMAGE=xipImage
ROOTFS_IMAGE=rootfs.cramfs
SPL_APP_BIN=spl_app.bin
OUT_IMAGE=metalio-eink4-plus-full-flash.bin
